services:
  postgres:
    image: postgres:16-alpine
    container_name: flashsale-postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: engine_user
      POSTGRES_PASSWORD: engine_password
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine_user -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: flashsale-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnamilegacy/kafka:3.7.1
    container_name: flashsale-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_KRAFT_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-init:
    image: bitnamilegacy/kafka:3.7.1
    container_name: flashsale-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created --partitions 1 --replication-factor 1
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.dlq --partitions 1 --replication-factor 1
    restart: "no"

  inventory-service:
    build:
      context: ..
      dockerfile: src/InventoryService/Dockerfile
    container_name: flashsale-inventory-service
    environment:
      - Redis__ConnectionString=redis:6379
    ports:
      - "50051:50051"
    depends_on:
      redis:
        condition: service_healthy

  ingress-gateway:
    build:
      context: ..
      dockerfile: src/IngressGateway/Dockerfile
    container_name: flashsale-ingress-gateway
    environment:
      - Redis__ConnectionString=redis:6379
      - InventoryService__GrpcAddress=http://inventory-service:50051
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      inventory-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  order-worker-fleet:
    build:
      context: ..
      dockerfile: src/OrderWorkerFleet/Dockerfile
    container_name: flashsale-order-worker
    environment:
      - ConnectionStrings__Orders=Host=postgres;Port=5432;Database=orders_db;Username=engine_user;Password=engine_password;
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: on-failure

  envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: flashsale-envoy
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - ingress-gateway

volumes:
  pgdata:
